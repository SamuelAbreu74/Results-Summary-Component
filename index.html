<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Results summary component</title>

</head>

<body>
  <main>
    <!-- Result Section -->
    <section class="result-section">
      <!-- Result data container -->
      <div class="result-container">
        <h4>Your Result</h4>
        <!-- Circle Container -->
        <div class="circle-container">
          <h1>76</h1>
          <p>of 100</p>
        </div>

        <!-- Result Text Info -->
        <div class="result-text-info">
          <h2>Great</h2>
          <p>You scored higher than 65% of the people who have taken these tests.</p>
        </div>
      </div>
    </section>

    <!-- Summary Section -->
    <section class="summary-section">
      <h3>Summary</h3>
      <!-- Subjects Cards Container -->
      <div class="subjects-card-container">
        <!-- Subject Card -->
        <div class="subject-card" style="background-color: hsla(0, 100%, 67%, 0.11); color: hsl(0, 100%, 67%) ;">
          <!-- Subject Name -->
          <div class="subject-title">
            <img src="./assets/images/icon-reaction.svg" alt="reaction-subject-icon">
            <div>Reaction</div>
          </div>
          <!-- Subject Scores -->
          <div class="subject-scores">
            80 <span>/ 100</span>
          </div>
        </div>

        <!-- Subject Card -->
        <div class="subject-card" style="background-color: hsl(39, 100%, 56%, 0.11); color: hsl(39, 100%, 56%);">
          <!-- Subject Name -->
          <div class="subject-title">
            <img src="./assets/images/icon-memory.svg" alt="reaction-subject-icon">
            <h4>Memory</h4>
          </div>
          <!-- Subject Scores -->
          <div class="subject-scores">
            92 <span>/ 100</span>
          </div>
        </div>

        <div class="subject-card" style="background-color: hsl(166, 100%, 37%, 0.11); color: hsl(166, 100%, 37%);">
          <!-- Subject Name -->
          <div class="subject-title">
            <img src="./assets/images/icon-verbal.svg" alt="reaction-subject-icon">
            <h4>Verbal</h4>
          </div>
          <!-- Subject Scores -->
          <div class="subject-scores">
            61 <span>/ 100</span>
          </div>
        </div>

        <div class="subject-card" style="background-color: hsl(234, 85%, 45%, 0.11); color: hsl(234, 85%, 45%);">
          <!-- Subject Name -->
          <div class="subject-title">
            <img src="./assets/images/icon-visual.svg" alt="reaction-subject-icon">
            <h4>Visual</h4>
          </div>
          <!-- Subject Scores -->
          <div class="subject-scores">
            73 <span>/ 100</span>
          </div>
        </div>
      </div>

      <!-- Continue Button -->
      <button class="continue-button">Continue</button>
    </section>
  </main>

    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>

</head>

<body>



  <main>
    <!-- Result Section -->
    <section>
      <!-- Result data container -->
      <div>
        <h3>Your Result</h3>
        <!-- Circle Container -->
        <div>
          <h1>76</h1>
          <p>of 100</p>
        </div>

        <h2>Great</h2>
        <p>You scored higher than 65% of the people who have taken these tests.</p>

      </div>
    </section>

    <!-- Summary Section -->
    <section>
      <h3>Summary</h3>
      <!-- Subjects Cards Container -->
      <div>
        <!-- Subject Card -->
        <div>
          <!-- Subject Name -->
          <div>Reaction</div>
          <!-- Subject Scores -->
          <div>80 / 100</div>
        </div>
        <!-- Subject Card -->
        <div>
          <!-- Subject Name -->
          <div>Memory</div>
          <!-- Subject Scores -->
          <div>92 / 100</div>
        </div>
        <!-- Subject Card -->
        <div>
          <!-- Subject Name -->
          <div>Verbal</div>
          <!-- Subject Scores -->
          <div>61 / 100</div>
        </div>
        <!-- Subject Card -->
        <div>
          <!-- Subject Name -->
          <div>Visual</div>
          <!-- Subject Scores -->
          <div>73 / 100</div>
        </div>

      </div>

      <!-- Continue Button -->
      <button>Continue</button>
    </section>
  </main>


  <!-- <footer class="attribution">

    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>

</html>
